- date: 2026-09-07
  claim: >
    The VIX 20-25 bucket's apparent underperformance (win rate, avg P/L) is
    statistical noise, not a real regime effect. No fix needed or possible
    (a VIX-scaled max-premium cap, or a flat tighter cap, would not address a
    real effect because there isn't one -- and would just shrink the whole
    strategy since debit is similar across all VIX buckets already).
  confidence: high
  evidence: >
    n=35. Fisher's exact test on win rate: p=0.24 vs 15-20 bucket, p=0.19 vs
    all-other. Omnibus chi-square across all 5 VIX buckets: p=0.34 (no
    detectable relationship). Power to detect the observed win-rate gap at
    n=35 was only 22%. Avg P/L: Welch t-test/Mann-Whitney nominally p=0.015-
    0.029, but permutation test (better suited to skewed P/L data) gives
    p=0.07-0.09. Bonferroni-corrected for the 5-bucket post-hoc scan, every
    p-value lands at 0.36-1.0. Nothing survives correction.
  status: closed

- date: 2026-09-07
  claim: >
    Active exit management (profit target, stop loss, or early time-exit)
    makes this strategy WORSE on every metric tested, not better. The edge
    depends on holding to expiration to capture the convex tail.
  confidence: high
  evidence: >
    Three "Unsaved Backtest" clones run live in OO's engine (never saved,
    raw trade logs not retained -- only summary metrics captured):
    - Profit target 50% of debit: P/L $50,053 (vs $165,593 baseline), Sharpe
      1.23 (vs 2.10), Max Winner capped at $905/lot (vs $2,235) -- by far the
      most damaging, truncates the exact tail that carries the strategy.
    - Stop loss -50% of debit: P/L $123,300, Sharpe 1.85, Sortino 4.15 (vs
      4.01 baseline -- slightly better), Max Loser -$1,185/lot (vs -$1,605).
      Reduces tail risk and drawdown but still costs ~25% of total P/L; win
      rate drop (56.2% vs 64.3%) shows real trades that would've recovered by
      4pm got stopped early.
    - Time exit at 3:30pm (30min early): P/L $126,950, Sharpe 2.00 (~flat vs
      baseline), Sortino 4.16 (slightly better), Max Loser -$1,365/lot. Best
      balance of the three if managing for smoother drawdowns specifically,
      but still gives up ~23% of total P/L.
  status: closed

