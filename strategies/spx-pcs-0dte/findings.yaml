# SPX PCS -- 0 DTE, Daily
# Put credit spread, 45-delta short put / 5pt-wide long put, 0DTE, entered
# daily with a bullish-continuation filter (above 5-day SMA, min 0.3% up-move).

- date: 2026-09-08
  finding: >
    Standalone review, May 2022-Sep 2026: P/L $45,108, CAGR 9%, MDD -3.3%,
    MAR 2.7, Sharpe 1.34, Sortino 1.84, win 76.4%, 259 trades, avg winner
    $534/trade, avg loser -$995/trade (nearly 2x the avg winner -- high win
    rate is doing the work, not asymmetric payoff). Weakest of the five
    strategies reviewed in the "Claude portfolio test" OO portfolio on every
    risk-adjusted metric. Year-by-year P/L is declining (2022 $9.6K -> 2023
    $16.4K -> 2024 $8.0K -> 2025 $8.4K -> 2026 YTD $2.8K on 42 trades) --
    sample size per year is too small to call this confirmed decay, but it's
    a watch item.
  confidence: high
  status: closed
  note: >
    Entry filter (above 5-day SMA, min 0.3% up-move) is a fairly specific
    technical condition never checked for out-of-sample generalization --
    same generic overfitting caution that applies to any narrow entry
    filter, not yet tested here specifically.

- date: 2026-09-08
  finding: >
    Correlation check against the other four strategies in the portfolio
    (0-filled daily P/L, full history): PCS vs RIC = 0.161 full-history,
    0.355 restricted to days both had a closed position -- the strongest
    pairwise correlation of any pair across all five strategies, and in the
    wrong direction. On PCS's 10 worst single days, RIC was also negative on
    4 of them, including two of RIC's larger losses. Structurally sensible:
    both are 0DTE SPX premium-selling strategies exposed to the same
    large-intraday-move risk. All other PCS pairs (vs Butterfly, DC 1/2, DC
    5/7) are near zero, same as the rest of the matrix.
  confidence: high
  status: closed
  note: >
    Recommendation: leave PCS out of the live portfolio. Not a "needs more
    data" call -- weakest standalone risk-adjusted profile of the five, and
    the one strategy it's actually correlated with (RIC) is the wrong one to
    be correlated with, since RIC is one of the portfolio's two strongest
    independent performers.
